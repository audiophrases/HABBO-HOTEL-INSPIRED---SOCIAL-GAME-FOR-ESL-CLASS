<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PinPlay Cup Avatar Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101729;color:#eef2ff;font:15px system-ui;padding:28px}main{max-width:1150px;margin:auto}h1{margin:0}p{color:#aebad0}button,select,textarea,input{font:inherit}select,button{border:1px solid #455475;border-radius:8px;background:#24314d;color:#fff;padding:8px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.picker{background:#1c2740;padding:18px;border-radius:14px;margin:20px 0}.picker select{min-width:250px;margin-left:15px}.layout{display:grid;grid-template-columns:340px 1fr;gap:24px}.panel{background:#1c2740;padding:22px;border-radius:16px}#avatarDisplay{width:240px;height:250px;margin:0 auto 18px;background:#111b30;border-radius:18px}svg{width:100%;height:100%}.control{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.control select{max-width:210px;width:210px}.control button{background:none;border:0;padding:0;text-align:left}.active{color:#a8aaff!important}textarea{width:100%;height:200px;background:#0c1221;color:#b2c7ff;border:1px solid #455475;padding:12px;border-radius:8px;font:12px monospace}#activePartPath{overflow-wrap:anywhere;font:12px monospace;color:#aebad0;margin:12px 0}canvas{background:#101729;border:1px solid #455475;touch-action:none;width:250px;height:260px}.draw{display:flex;gap:15px;margin-top:18px}.tools{display:flex;flex-direction:column;gap:14px}#status{min-height:24px;color:#b7c8ed;margin:12px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}#savePartBtn{background:#5557db}small{color:#9cabc4}label{display:block}@media(max-width:800px){.layout{grid-template-columns:1fr}.draw{flex-wrap:wrap}body{padding:12px}}
</style></head><body><main>
<h1>PinPlay Cup Avatar Studio</h1><p>Choose a character, then change any part. All editing and drawing stays in this tab until you explicitly save.</p>

<div class="layout"><section class="panel"><div id="avatarDisplay"></div><div id="controlsContainer"></div><button id="randomBtn">Surprise me</button></section>
<section class="panel"><h2 id="activePartTitle">Part editor</h2><label>Editable layer <select id="layerPicker"></select></label><div id="activePartPath"></div>
<textarea id="svgCodeInput" spellcheck="false" aria-label="SVG draft"></textarea>
<div class="draw"><canvas id="drawCanvas" width="250" height="260" aria-label="Draw strokes on selected layer"></canvas><div class="tools"><label>Stroke colour <input type="color" id="brushColor" value="#ff00ff"></label><label>Brush size <input type="range" id="brushSize" min="1" max="20" value="4"></label><button id="clearCanvasBtn">Clear pending strokes</button><button id="applyCanvasBtn">Apply strokes to draft</button></div></div>
<p id="status" role="status">Loading local catalog…</p><div class="actions"><button id="savePartBtn">Save selected layer to disk</button><button id="deletePartBtn" style="background:#db5555" title="Deletes the current preset or editable SVG part">Delete element</button><button id="rebuildBtn">Build student bundle locally</button><button id="syncBtn" style="background:#2ea043;font-weight:bold" title="Commit, push, and deploy Cloudflare Worker">Check &amp; Sync Cloud</button></div><p><small>Original animal portraits are not edited.</small></p></section></div>
</main><script src="cup/avatar-parts.js"></script><script src="scripts/avatar-runtime.js"></script><script src="studio.js"></script></body></html>
